services:
  - type: web
    name: promessometro-api
    runtime: node
    plan: free
    buildCommand: npm install && npx tsx --version
    startCommand: npx tsx server.ts
    envVars:
      - key: NODE_VERSION
        value: 22.0.0
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - fromGroup: promessometro-supabase
      - fromGroup: promessometro-ai
      - fromGroup: promessometro-stripe
      - fromGroup: promessometro-app
