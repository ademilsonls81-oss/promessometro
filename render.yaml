services:
  - type: web
    name: promessometro-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.0.0
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      # Supabase (Required)
      - fromGroup: promessometro-supabase
      # AI Provider
      - fromGroup: promessometro-ai
      # Stripe
      - fromGroup: promessometro-stripe
      # App Config
      - fromGroup: promessometro-app
